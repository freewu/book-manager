name: Release

# 发布 / 改版本号都会触发，产出三平台免安装包并用提交信息生成 release message：
#   1. 推 v* 标签（发布）        → 用标签名当 release tag
#   2. main 上改了 src/version.go → 用 Version 当 tag（不存在就创建）
#   3. 手动 workflow_dispatch    → 可指定版本号 / 强制重建
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'src/version.go'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空 = 读 src/version.go 的 Version）'
        required: false
        default: ''
      force:
        description: '已存在同名 Release 且有附件时也重建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一个版本不要并发发布（后触发的等前面的跑完）
concurrency:
  group: release # 全局串行：改版本号与推标签可能同时命中，后者会因已发布而跳过
  cancel-in-progress: false

jobs:
  # 1) 算出 tag / 版本号，并判断是否需要真的发布
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release message 要完整提交历史

      - name: 计算版本号与 tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"                       # 手动指定优先
          else
            V=$(sed -n 's/^const Version = "\(.*\)"/\1/p' src/version.go)
          fi
          [ -n "$V" ] || { echo "::error::读不到 src/version.go 里的 Version"; exit 1; }
          case "$V" in v*) VER="${V#v}"; TAG="$V";; *) VER="$V"; TAG="v$V";; esac

          # 推标签时以标签名为准（版本号不一致只提示，不拦）
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "::warning::标签 $REF_NAME 与 src/version.go 的 $TAG 不一致，按标签名发布"
            TAG="$REF_NAME"
            case "$TAG" in v*) VER="${TAG#v}";; *) VER="$TAG";; esac
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # 已经发过（且附件在）就跳过，避免重复发布
          SKIP=false
          N=$(gh release view "$TAG" --json assets -q '.assets|length' 2>/dev/null || echo "")
          if [ -n "$N" ] && [ "$N" -gt 0 ] && [ "$INPUT_FORCE" != "true" ]; then
            SKIP=true
            echo "::notice::Release $TAG 已存在（$N 个附件），跳过。要重建请用 workflow_dispatch + force"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "版本号 = $VER，tag = $TAG，skip = $SKIP"

  # 2) 三平台各自构建 + 打包（都在目标系统上跑，Wails 不支持交叉编译）
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
            extra_tags: ''
          - os: ubuntu-latest
            platform: linux/amd64
            extra_tags: webkit2_41 # Ubuntu 24.04 起只有 webkit2gtk-4.1（4.0 是 Wails 默认）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: 安装 Wails CLI（版本跟随 go.mod）
        working-directory: src
        shell: bash # Windows runner 默认 pwsh，这里要 bash 的 $( )
        run: |
          V=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails $V"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$V"

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu 24.04 只有 webkit2gtk-4.1，配合 -tags webkit2_41 构建
          # fonts-noto-cjk：EPUB → PDF 排版要有可嵌入的中文字体
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk

      - name: 构建（wails build）
        working-directory: src
        shell: bash # Windows runner 默认 pwsh，下面用 bash 数组拼参数
        env:
          EXTRA_TAGS: ${{ matrix.extra_tags }}
        run: |
          args=(-platform "${{ matrix.platform }}" -o book-manager -clean)
          if [ -n "$EXTRA_TAGS" ]; then args+=(-tags "$EXTRA_TAGS"); fi
          echo "wails build ${args[*]}"
          wails build "${args[@]}"

      # 测试放在构建之后：`go test .` 要 embed frontend/dist 才能编译
      - name: Go 测试（Linux 顺带跑一遍，保证新平台能过测试）
        if: runner.os == 'Linux'
        working-directory: src
        run: |
          go test ./internal/...
          go test .

      - name: 前端静态检查（i18n key）
        if: runner.os == 'Linux'
        working-directory: src/frontend
        run: node scripts/check-i18n.mjs

      - name: 打包（Windows 免安装 zip）
        if: runner.os == 'Windows'
        working-directory: src
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = "book-manager-$env:VER-windows-x64.zip"
          Compress-Archive -Path build/bin/book-manager.exe -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $asset | Select-Object Name, Length

      - name: 打包（macOS 通用 app）
        if: runner.os == 'macOS'
        working-directory: src
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          asset="book-manager-$VER-macos-universal.zip"
          # ditto 才能保住 .app 的符号链接与权限
          ditto -c -k --sequesterRsrc --keepParent build/bin/book-manager.app "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          ls -l "$asset"

      - name: 打包（Linux 免安装 tar.gz）
        if: runner.os == 'Linux'
        working-directory: src
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          asset="book-manager-$VER-linux-x64.tar.gz"
          stage="$(mktemp -d)/book-manager-$VER"
          mkdir -p "$stage"
          cp build/bin/book-manager "$stage/"
          cp build/appicon.png "$stage/book-manager.png"
          cat > "$stage/book-manager.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Book Manager
          Comment=Local e-book library
          Exec=book-manager
          Icon=book-manager
          Categories=Office;Viewer;
          Terminal=false
          EOF
          tar -czf "$asset" -C "$(dirname "$stage")" "$(basename "$stage")"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          ls -l "$asset"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: src/${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 14

  # 3) 汇总提交信息当 release message，创建/更新 Release 并挂上三个包
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 收齐三平台安装包
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 用提交信息生成 release message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 上一个 tag（HEAD^ 避免匹配到自己的 tag）
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --no-merges --pretty=format:'- %s (%h)' "$PREV..HEAD" > commits.txt
          else
            git log --no-merges --pretty=format:'- %s (%h)' > commits.txt
          fi

          {
            echo "本机电子书管理 · 三平台**免安装**包（解压即用，不需要安装器）"
            echo
            echo "## 本次变更"
            echo
            if [ -n "$PREV" ]; then
              echo "自 \`$PREV\` 以来："
            else
              echo "首个发布，全部提交："
            fi
            echo
            cat commits.txt
            echo
            echo
            echo "## 下载"
            echo
            echo "| 平台 | 文件 | 用法 |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 x64 | \`book-manager-$VER-windows-x64.zip\` | 解压后双击 \`book-manager.exe\`（WebView2 系统自带） |"
            echo "| macOS（Apple Silicon + Intel） | \`book-manager-$VER-macos-universal.zip\` | 解压得到 \`book-manager.app\`，拖到「应用程序」即可 |"
            echo "| Linux x64 | \`book-manager-$VER-linux-x64.tar.gz\` | 解压后 \`./book-manager\`（另有 .desktop 与图标可装进菜单） |"
            echo
            echo "## 运行要求"
            echo
            echo "- Windows：Windows 10/11 + WebView2 运行时（系统自带）。"
            echo "- macOS：未签名，首次打开若被 Gatekeeper 拦下，执行 \`xattr -dr com.apple.quarantine book-manager.app\`。"
            echo "- Linux（在 Ubuntu 24.04 上构建）：需要 \`libwebkit2gtk-4.1\` 与 \`libgtk-3-0\`（glibc 2.39+）；更老的发行版请自行 \`just release\` 编译。"
            echo
            echo "三平台的 \`data/\`（book.db + 封面缓存）默认放在可执行文件旁边；想固定位置可以设环境变量 \`BOOKMANAGER_DATA_DIR\`。"
            echo
            if [ -n "$PREV" ]; then
              echo "**完整对比**：https://github.com/$REPO/compare/$PREV...$TAG"
            fi
          } > notes.md
          echo "--- notes.md ---"; cat notes.md

      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          EXTRA=()
          case "$TAG" in *-*) EXTRA+=(--prerelease);; esac   # v1.2.3-beta.1 这类当预发布
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "book-manager $TAG" --notes-file notes.md "${EXTRA[@]}"
          else
            TARGET=()
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || TARGET+=(--target="$GITHUB_SHA")
            gh release create "$TAG" dist/* \
              --title "book-manager $TAG" \
              --notes-file notes.md "${TARGET[@]}" "${EXTRA[@]}"
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[].name)'
